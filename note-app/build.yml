name: Build Mac and Windows Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Build Mac App
        run: npm run pack:mac
      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: Mac-App
          path: release/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Build Windows App
        run: npm run build:desktop
      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: release/*.exe